version: '3.8'

networks:
  agrishield-network:
    name: agrishield-network
    driver: bridge

volumes:
  postgres_data:
  orderer_data:
  peer0_org1_data:
  peer0_org2_data:
  couchdb0_data:
  couchdb1_data:

services:
  # =========================================================================
  # 1. POSTGRESQL 15 DATABASE (Operational Relational Store)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: agrishield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrishield_db}
      POSTGRES_USER: ${POSTGRES_USER:-agrishield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrishield_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrishield_user} -d ${POSTGRES_DB:-agrishield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrishield-network

  # =========================================================================
  # 2. HYPERLEDGER FABRIC 2.5 NETWORK (CouchDB, Peers, Raft Orderer)
  # =========================================================================
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.example.com
    restart: unless-stopped
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    ports:
      - "7050:7050"
    volumes:
      - orderer_data:/var/hyperledger/production/orderer
    networks:
      - agrishield-network

  couchdb0:
    image: couchdb:3.3
    container_name: couchdb0
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
    ports:
      - "5984:5984"
    volumes:
      - couchdb0_data:/opt/couchdb/data
    networks:
      - agrishield-network

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.example.com
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=agrishield-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:-admin}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:-password}
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0_org1_data:/var/hyperledger/production
    depends_on:
      - couchdb0
      - orderer.example.com
    networks:
      - agrishield-network

  couchdb1:
    image: couchdb:3.3
    container_name: couchdb1
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
    ports:
      - "7984:5984"
    volumes:
      - couchdb1_data:/opt/couchdb/data
    networks:
      - agrishield-network

  peer0.org2.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org2.example.com
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=agrishield-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_ADDRESS=peer0.org2.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.example.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:-admin}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:-password}
    ports:
      - "9051:9051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0_org2_data:/var/hyperledger/production
    depends_on:
      - couchdb1
      - orderer.example.com
    networks:
      - agrishield-network

  # =========================================================================
  # 3. JAVA 17 / SPRING BOOT 3.1.5 BACKEND MICROSERVICE
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrishield-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agrishield_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-agrishield_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-agrishield_secure_pass_2026}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - FABRIC_PEER_ENDPOINT=peer0.org1.example.com:7051
      - FABRIC_CHANNEL=farmchannel
      - FABRIC_CHAINCODE=mrl-amu-contract
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      peer0.org1.example.com:
        condition: service_started
    networks:
      - agrishield-network

  # =========================================================================
  # 4. REACT 18 + TAILWIND CSS FRONTEND WEB CLIENT
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrishield-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8080/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agrishield-network
